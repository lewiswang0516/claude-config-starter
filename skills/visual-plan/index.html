<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案预览 · Visual Plan</title>
<script src="/vendor/tailwind.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<style>
  .diff-line { white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .spin { animation: spin 0.8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { height: 8px; width: 8px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  details.file-entry > summary { list-style: none; cursor: pointer; }
  details.file-entry > summary::-webkit-details-marker { display: none; }
  details.file-entry[open] .chevron { transform: rotate(90deg); }
  .chevron { transition: transform 0.15s ease; }
  @keyframes flash-bg { 0% { background-color: #fef3c7; } 100% { background-color: transparent; } }
  .flash { animation: flash-bg 1.6s ease-out; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<!-- Sticky header -->
<header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-center gap-4">
    <div class="flex-1 min-w-0">
      <h1 id="title" class="text-lg font-semibold truncate">等待方案…</h1>
      <p id="version-tag" class="text-xs text-slate-400">v0 · 未连接</p>
    </div>
    <button onclick="submitPlan('feedback')" class="shrink-0 px-4 py-2 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-50">发送反馈</button>
    <button onclick="submitPlan('execute')" class="shrink-0 px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 shadow-sm">✓ 执行方案</button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-5 py-6 space-y-6" id="content"></main>

<!-- Feedback dock -->
<div class="sticky bottom-0 z-20 bg-white border-t border-slate-200">
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-end gap-3">
    <textarea id="feedback" rows="1" placeholder="在这里写你的意见 / 修改要求，然后点「发送反馈」。勾选的问题和选中的方案也会一并发送。"
      class="flex-1 resize-none rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"></textarea>
    <button onclick="submitPlan('feedback')" class="shrink-0 px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium hover:bg-slate-900">发送</button>
  </div>
</div>

<!-- Overlay -->
<div id="overlay" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl px-8 py-7 max-w-sm text-center">
    <div id="overlay-icon" class="text-4xl mb-3"></div>
    <p id="overlay-text" class="text-slate-700"></p>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });

let currentVersion = -1;
let planRound = 0; // human-friendly counter shown in the header
let currentPlan = {};
let prevSectionSig = {};   // section key -> JSON signature of last render
let selectedOption = null; // chosen option id, survives re-render when still present
let mmdSeq = 0;
let waitingForUpdate = false;
let firstRender = true;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- unified line diff (LCS) ----------
function diffLines(before, after) {
  const a = String(before || '').split('\n');
  const b = String(after || '').split('\n');
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push(['ctx', a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['del', a[i]]); i++; }
    else { out.push(['add', b[j]]); j++; }
  }
  while (i < n) out.push(['del', a[i++]]);
  while (j < m) out.push(['add', b[j++]]);
  return out;
}

function diffStat(diff) {
  let add = 0, del = 0;
  diffLines(diff.before, diff.after).forEach(([t]) => { if (t === 'add') add++; else if (t === 'del') del++; });
  return { add, del };
}

function renderDiffBody(diff) {
  const rows = diffLines(diff.before, diff.after).map(([t, text]) => {
    const style = t === 'add' ? 'bg-emerald-50 text-emerald-800' : t === 'del' ? 'bg-rose-50 text-rose-800' : 'text-slate-600';
    const sign = t === 'add' ? '+' : t === 'del' ? '-' : ' ';
    return `<div class="diff-line px-3 ${style}"><span class="inline-block w-4 select-none opacity-60">${sign}</span>${esc(text)}</div>`;
  }).join('');
  return `<div class="rounded-lg border border-slate-200 overflow-hidden"><div class="overflow-x-auto bg-white py-1">${rows}</div></div>`;
}

// ---------- section builders ----------
function sectionTitle(t) {
  return `<h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-3">${esc(t)}</h2>`;
}

function sectionWrap(key, updated, inner, extraClass) {
  const badge = updated ? '<span class="absolute top-3 right-4 text-[11px] font-semibold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">已更新</span>' : '';
  return `<section data-sec="${key}" class="relative bg-white rounded-xl p-5 shadow-sm ${extraClass || ''} ${updated ? 'flash ring-1 ring-amber-300' : ''}">${badge}${inner}</section>`;
}

const ACTION_BADGE = { add: 'bg-emerald-100 text-emerald-700', modify: 'bg-amber-100 text-amber-700', delete: 'bg-rose-100 text-rose-700' };
const ACTION_LABEL = { add: '新增', modify: '修改', delete: '删除' };

function renderFileEntry(f) {
  const stat = f.diff ? diffStat(f.diff) : null;
  const statHtml = stat
    ? `<span class="shrink-0 text-xs font-mono"><span class="text-emerald-600">+${stat.add}</span> <span class="text-rose-600">-${stat.del}</span></span>`
    : '';
  const hasBody = (Array.isArray(f.changes) && f.changes.length) || f.diff;
  const changesHtml = (Array.isArray(f.changes) && f.changes.length)
    ? `<ul class="space-y-1 mb-3">${f.changes.map((c) => `<li class="flex gap-2 text-sm text-slate-600"><span class="text-slate-300 select-none">▸</span><span>${esc(c)}</span></li>`).join('')}</ul>`
    : '';
  const diffHtml = f.diff ? renderDiffBody(f.diff) : '';
  const chevron = hasBody
    ? '<span class="chevron shrink-0 text-slate-400 text-xs select-none">▶</span>'
    : '<span class="shrink-0 w-3"></span>';
  const summary = `<summary class="flex items-center gap-3 py-2 px-2 -mx-2 rounded-lg ${hasBody ? 'hover:bg-slate-50' : 'cursor-default'}">
      ${chevron}
      <span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded ${ACTION_BADGE[f.action] || 'bg-slate-100 text-slate-600'}">${ACTION_LABEL[f.action] || esc(f.action || '')}</span>
      <code class="text-sm text-slate-700 min-w-0 truncate">${esc(f.path)}</code>
      ${statHtml}
      <span class="text-sm text-slate-400 truncate flex-1 text-right">${esc(f.note || '')}</span>
    </summary>`;
  if (!hasBody) return `<div class="file-entry border-b border-slate-100 last:border-0" data-path="${esc(f.path)}">${summary.replace('<summary', '<div').replace('</summary>', '</div>')}</div>`;
  return `<details class="file-entry border-b border-slate-100 last:border-0" data-path="${esc(f.path)}">
      ${summary}
      <div class="pb-3 pl-7 pr-1">${changesHtml}${diffHtml}</div>
    </details>`;
}

function renderFileChanges(list, updated) {
  // group by directory, preserving first-appearance order
  const groups = new Map();
  list.forEach((f) => {
    const dir = f.path && f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '.';
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(f);
  });
  const totalStat = list.reduce((acc, f) => {
    if (f.diff) { const s = diffStat(f.diff); acc.add += s.add; acc.del += s.del; }
    return acc;
  }, { add: 0, del: 0 });
  const headline = `<span class="text-xs font-mono normal-case tracking-normal text-slate-400 ml-2">${list.length} 个文件${totalStat.add + totalStat.del ? ` · <span class="text-emerald-600">+${totalStat.add}</span> <span class="text-rose-600">-${totalStat.del}</span>` : ''}</span>`;
  const body = [...groups.entries()].map(([dir, files]) => `
    <div class="mb-1 last:mb-0">
      <div class="text-xs font-mono text-slate-400 pt-2 pb-1 flex items-center gap-1.5"><span class="select-none">📁</span>${esc(dir)}/</div>
      <div class="pl-1">${files.map(renderFileEntry).join('')}</div>
    </div>`).join('');
  return sectionWrap('fileChanges', updated, `${sectionTitle('文件改动清单').replace('</h2>', headline + '</h2>')}${body}`);
}

function renderSteps(steps, updated) {
  const cards = steps.map((s, i) => {
    const chips = (Array.isArray(s.files) ? s.files : []).map((p) =>
      `<button onclick="revealFile('${esc(p)}')" class="text-xs font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 hover:bg-emerald-50 hover:text-emerald-700 transition-colors">${esc(p.includes('/') ? p.slice(p.lastIndexOf('/') + 1) : p)}</button>`).join('');
    return `<div class="flex gap-4">
      <div class="flex flex-col items-center self-stretch">
        <div class="relative z-10 shrink-0 w-7 h-7 rounded-full bg-slate-800 text-white text-sm flex items-center justify-center font-semibold">${i + 1}</div>
        ${i < steps.length - 1 ? '<div class="w-px flex-1 bg-slate-200 mt-1"></div>' : ''}
      </div>
      <div class="flex-1 ${i < steps.length - 1 ? 'pb-5' : ''} pt-0.5">
        <div class="font-medium text-slate-800">${esc(s.title)}</div>
        ${s.detail ? `<div class="text-sm text-slate-500 mt-0.5">${esc(s.detail)}</div>` : ''}
        ${chips ? `<div class="flex flex-wrap gap-1.5 mt-1.5">${chips}</div>` : ''}
      </div></div>`;
  }).join('');
  return sectionWrap('steps', updated, `${sectionTitle('实现步骤')}<div>${cards}</div>`);
}

function renderOptions(opts, updated) {
  const cards = opts.map((o) => {
    const sel = selectedOption === o.id;
    const pros = (o.pros || []).map((p) => `<li class="flex gap-1.5 text-sm text-slate-600"><span class="text-emerald-500 shrink-0">✓</span><span>${esc(p)}</span></li>`).join('');
    const cons = (o.cons || []).map((c) => `<li class="flex gap-1.5 text-sm text-slate-600"><span class="text-rose-400 shrink-0">✗</span><span>${esc(c)}</span></li>`).join('');
    return `<button onclick="selectOption('${esc(o.id)}')" data-opt="${esc(o.id)}"
      class="opt-card text-left rounded-xl border-2 p-4 transition-all ${sel ? 'border-emerald-500 bg-emerald-50/40 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white'}">
      <div class="flex items-center gap-2 mb-1">
        <span class="opt-dot w-4 h-4 rounded-full border-2 shrink-0 flex items-center justify-center ${sel ? 'border-emerald-500' : 'border-slate-300'}">${sel ? '<span class="w-2 h-2 rounded-full bg-emerald-500"></span>' : ''}</span>
        <span class="font-semibold text-slate-800">${esc(o.title)}</span>
        ${o.recommended ? '<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">推荐</span>' : ''}
      </div>
      ${o.summary ? `<p class="text-sm text-slate-500 mb-2 ml-6">${esc(o.summary)}</p>` : ''}
      <div class="ml-6 space-y-2">
        ${pros ? `<ul class="space-y-0.5">${pros}</ul>` : ''}
        ${cons ? `<ul class="space-y-0.5">${cons}</ul>` : ''}
      </div>
    </button>`;
  }).join('');
  return sectionWrap('options', updated,
    `${sectionTitle('方案选择')}<div class="grid gap-3 ${opts.length > 1 ? 'md:grid-cols-2' : ''}">${cards}</div>`,
    'ring-1 ring-sky-200');
}

// ---------- UI before/after previews ----------
// Mockups render inside sandboxed iframes: no script execution, no external resources.
function uiFrameDoc(html) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;color:#0f172a;background:#fff}
  </style></head><body>${html}</body></html>`;
}

window.fitFrame = function (fr) {
  try {
    fr.style.height = '0px'; // collapse first: scrollHeight is floored at the current viewport height
    const h = fr.contentDocument.documentElement.scrollHeight;
    fr.style.height = Math.max(60, Math.min(h + 4, 640)) + 'px';
  } catch (e) { fr.style.height = '240px'; }
};

function uiPane(label, labelClass, html, width) {
  const style = (width ? `width:${width}px;max-width:100%;` : 'width:100%;') + 'border:0;display:block';
  return `<div class="flex-1 min-w-0">
      <div class="text-xs font-semibold mb-1.5 ${labelClass}">${label}</div>
      <div class="rounded-lg border border-slate-200 bg-slate-50 overflow-x-auto">
        <iframe class="mx-auto bg-white" style="${style}" sandbox="allow-same-origin" onload="fitFrame(this)" srcdoc="${esc(uiFrameDoc(html))}"></iframe>
      </div></div>`;
}

function renderUiPreviews(list, updated) {
  const cards = list.map((u) => {
    const chips = (Array.isArray(u.files) ? u.files : []).map((p) =>
      `<button onclick="revealFile('${esc(p)}')" class="text-xs font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 hover:bg-emerald-50 hover:text-emerald-700 transition-colors">${esc(p.includes('/') ? p.slice(p.lastIndexOf('/') + 1) : p)}</button>`).join('');
    const panes = u.before != null
      ? uiPane('改动前', 'text-rose-500', u.before, u.width)
        + '<div class="self-center text-slate-300 text-xl select-none px-1 hidden md:block">→</div>'
        + uiPane('改动后', 'text-emerald-600', u.after, u.width)
      : uiPane('新增', 'text-emerald-600', u.after, u.width);
    return `<div class="py-4 border-b border-slate-100 last:border-0 last:pb-0 first:pt-0">
      <div class="flex items-center gap-2 flex-wrap mb-2">
        <span class="font-medium text-slate-800">${esc(u.title)}</span>
        ${u.note ? `<span class="text-sm text-slate-400">${esc(u.note)}</span>` : ''}
        ${chips}
      </div>
      <div class="flex flex-col md:flex-row gap-3">${panes}</div>
    </div>`;
  }).join('');
  return sectionWrap('uiPreviews', updated, `${sectionTitle('界面变化预览')}${cards}`);
}

function renderQuestions(qs, updated) {
  const blocks = qs.map((q) => {
    let input = '';
    if (q.type === 'text') {
      input = `<textarea data-q="${esc(q.id)}" rows="2" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" placeholder="你的回答…"></textarea>`;
    } else {
      const multi = q.type === 'multi';
      input = `<div class="mt-2 space-y-1.5">${(q.options || []).map((opt) => `
        <label class="flex items-center gap-2.5 text-sm text-slate-700 cursor-pointer hover:bg-slate-50 rounded px-2 py-1.5">
          <input type="${multi ? 'checkbox' : 'radio'}" name="q-${esc(q.id)}" data-q="${esc(q.id)}" value="${esc(opt)}" class="accent-emerald-600 w-4 h-4"/>
          <span>${esc(opt)}</span></label>`).join('')}</div>`;
    }
    return `<div class="py-3 border-b border-slate-100 last:border-0">
      <div class="font-medium text-slate-800">${esc(q.question)}</div>${input}</div>`;
  }).join('');
  return sectionWrap('questions', updated, `${sectionTitle('需要你确认的问题')}${blocks}`, 'ring-1 ring-amber-200');
}

// ---------- interactions ----------
window.revealFile = function (path) {
  const el = document.querySelector(`.file-entry[data-path="${CSS.escape(path)}"]`);
  if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash');
  void el.offsetWidth; // restart animation
  el.classList.add('flash');
};

window.selectOption = function (id) {
  selectedOption = selectedOption === id ? null : id;
  // repaint option cards only, so question inputs are not wiped
  const sec = document.querySelector('[data-sec="options"]');
  if (sec && Array.isArray(currentPlan.options)) {
    sec.outerHTML = renderOptions(currentPlan.options, false);
  }
};

async function render(plan) {
  document.getElementById('title').textContent = plan.title || '方案';
  document.getElementById('version-tag').textContent = `第 ${planRound} 版 · 已连接`;
  const c = document.getElementById('content');

  // keep chosen option only if it still exists in the new plan
  if (selectedOption && !(plan.options || []).some((o) => o.id === selectedOption)) selectedOption = null;

  const sig = {};
  const changed = (key, data) => {
    sig[key] = JSON.stringify(data);
    return !firstRender && key in prevSectionSig && prevSectionSig[key] !== sig[key];
  };
  const arch = typeof plan.architecture === 'string' ? plan.architecture : (plan.architecture && plan.architecture.mermaid);

  let html = '';
  if (plan.summary) html += sectionWrap('summary', changed('summary', plan.summary), `<p class="text-slate-700 leading-relaxed">${esc(plan.summary)}</p>`);
  if (arch) html += sectionWrap('architecture', changed('architecture', arch), `${sectionTitle('架构 / 流程')}<div id="mmd-box" class="overflow-x-auto flex justify-center"></div>`);
  if (Array.isArray(plan.options) && plan.options.length) html += renderOptions(plan.options, changed('options', plan.options));
  if (Array.isArray(plan.steps) && plan.steps.length) html += renderSteps(plan.steps, changed('steps', plan.steps));
  if (Array.isArray(plan.uiPreviews) && plan.uiPreviews.length) html += renderUiPreviews(plan.uiPreviews, changed('uiPreviews', plan.uiPreviews));
  if (Array.isArray(plan.fileChanges) && plan.fileChanges.length) html += renderFileChanges(plan.fileChanges, changed('fileChanges', plan.fileChanges));
  if (Array.isArray(plan.questions) && plan.questions.length) html += renderQuestions(plan.questions, changed('questions', plan.questions));

  prevSectionSig = sig;
  firstRender = false;
  c.innerHTML = html;

  if (arch) {
    const box = document.getElementById('mmd-box');
    try {
      const { svg } = await mermaid.render('mmd' + (mmdSeq++), arch);
      box.innerHTML = svg;
    } catch (e) {
      box.innerHTML = `<pre class="text-xs text-rose-600 whitespace-pre-wrap">图渲染失败: ${esc(e.message)}\n\n${esc(arch)}</pre>`;
    }
  }
}

// ---------- collect + submit ----------
function collectAnswers() {
  const ans = {};
  (currentPlan.questions || []).forEach((q) => {
    if (q.type === 'multi') {
      ans[q.id] = [...document.querySelectorAll(`[data-q="${CSS.escape(q.id)}"]:checked`)].map((el) => el.value);
    } else if (q.type === 'text') {
      const el = document.querySelector(`[data-q="${CSS.escape(q.id)}"]`);
      ans[q.id] = el ? el.value : '';
    } else {
      const el = document.querySelector(`[data-q="${CSS.escape(q.id)}"]:checked`);
      ans[q.id] = el ? el.value : null;
    }
  });
  return ans;
}

function showOverlay(icon, text, spinning) {
  document.getElementById('overlay-icon').innerHTML = spinning
    ? '<div class="spin inline-block w-8 h-8 border-3 border-slate-300 border-t-emerald-600 rounded-full" style="border-width:3px"></div>'
    : icon;
  document.getElementById('overlay-text').textContent = text;
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('overlay').classList.add('flex');
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay').classList.remove('flex');
}

window.submitPlan = async function (action) {
  const payload = {
    action,
    answers: collectAnswers(),
    option: selectedOption,
    feedback: document.getElementById('feedback').value.trim(),
  };
  try {
    await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  } catch (e) {}
  if (action === 'execute') {
    showOverlay('✅', '已发送执行信号，Claude 即将开始编码。可以切回终端查看进度。', false);
  } else {
    waitingForUpdate = true;
    showOverlay('', '反馈已发送，Claude 正在更新方案…', true);
    document.getElementById('feedback').value = '';
  }
};

// ---------- live sync ----------
async function tick() {
  try {
    const r = await fetch('/api/plan', { cache: 'no-store' });
    const d = await r.json();
    if (d.version !== currentVersion) {
      currentVersion = d.version;
      planRound++;
      currentPlan = d.plan || {};
      await render(currentPlan);
      if (waitingForUpdate) { waitingForUpdate = false; hideOverlay(); }
    }
  } catch (e) {
    document.getElementById('version-tag').textContent = `第 ${planRound} 版 · 连接断开`;
  }
}
setInterval(tick, 1500);
tick();

// auto-grow feedback box
const fb = document.getElementById('feedback');
fb.addEventListener('input', () => { fb.style.height = 'auto'; fb.style.height = Math.min(fb.scrollHeight, 160) + 'px'; });
</script>
</body>
</html>
